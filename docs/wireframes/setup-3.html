<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setup 3 — Pé-de-meia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="setup-shell">
      <p class="brand" style="padding: 0"><a href="index.html">Pé-de-meia</a></p>
      <div class="steps">
        <div class="step-dot on"></div>
        <div class="step-dot on"></div>
        <div class="step-dot on"></div>
      </div>
      <h1 class="page-title">Saldo e cartão</h1>
      <p class="page-sub">
        Para o app avisar quando a conta aperta e quando a fatura vai doer.
      </p>

      <div class="field">
        <label>Quanto tem na conta hoje?</label>
        <input type="text" value="R$ 2.500" readonly />
      </div>
      <div class="row-2">
        <div class="field">
          <label>Fecha o cartão no dia</label>
          <input type="text" value="1" readonly />
        </div>
        <div class="field">
          <label>Vence no dia</label>
          <input type="text" value="10" readonly />
        </div>
      </div>

      <div class="coach">
        <div class="coach-title">Prévia do seu mês</div>
        <p>
          Com o que você configurou, a <strong>folga</strong> seria cerca de
          <strong style="color: var(--income)">R$ 4.780</strong>
          (8.000 − 2.120 − 1.100).
        </p>
      </div>

      <div class="btn-row">
        <a class="btn btn-ghost" href="setup-2.html">Voltar</a>
        <a class="btn btn-primary" href="home.html">Ver meu mês</a>
      </div>

      <p class="wire-note">
        Aha do setup: ver a folga antes de qualquer lançamento diário.
      </p>
    </div>
  </body>
</html>
