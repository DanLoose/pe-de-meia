services:
  postgres:
    image: postgres:16-alpine
    container_name: pe-de-meia-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pedemeia
      POSTGRES_PASSWORD: pedemeia
      POSTGRES_DB: pedemeia
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
